<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14140f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Rutina · 31 ago - 14 set</title>
<style>
:root{
  --ink:#14140f; --yellow:#f5c400; --paper:#fbfaf6; --pen:#1b3a8f;
  --rule:#d9d5c9; --dim:#6f6b60; --done:#2f7d32; --card:#ffffff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.4;
  padding-bottom:env(safe-area-inset-bottom);
}
header{position:sticky;top:0;z-index:20;background:var(--ink);padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.title h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.06em;color:#fff}
.title span{font-size:11px;color:var(--yellow);font-weight:700;letter-spacing:.04em}
.weeks{display:flex;gap:6px;margin-top:9px}
.weeks button{flex:1;border:0;border-radius:6px 6px 0 0;padding:7px 0;font:inherit;font-size:12px;
  font-weight:700;background:#2b2a23;color:#a9a599;cursor:pointer}
.weeks button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
nav{display:flex;background:var(--ink);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:58px;border:0;background:none;color:#8e8a7e;font:inherit;font-size:12px;
  font-weight:700;letter-spacing:.05em;padding:11px 12px 9px;border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-current="true"]{color:#fff;border-bottom-color:var(--yellow)}
nav button .dot{display:block;font-size:9px;font-weight:600;color:var(--done);margin-top:2px;height:11px}
.focus{background:var(--yellow);padding:9px 14px;font-size:13px;font-weight:700;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.focus small{font-weight:600;font-size:11px;opacity:.75}
main{padding:12px 10px 100px}
.ex{background:var(--card);border:1px solid var(--rule);border-radius:10px;margin-bottom:10px;overflow:hidden}
.ex.done{border-color:#b9d4ba;background:#fbfefb}
.top{display:flex;gap:11px;padding:11px 11px 8px}
.thumb{width:76px;height:76px;flex:0 0 76px;border:1px solid var(--rule);border-radius:7px;
  background:#f2f0e9 center/contain no-repeat}
.meta{min-width:0;flex:1}
.meta h2{margin:0 0 2px;font-size:15px;font-weight:800;line-height:1.22}
.meta p{margin:0 0 5px;font-size:11.5px;color:var(--dim);line-height:1.3}
.target{display:inline-block;background:var(--ink);color:var(--yellow);font-size:12px;font-weight:800;
  padding:3px 8px;border-radius:4px}
.target + .target{background:#efece2;color:var(--dim);font-weight:700;margin-left:6px}
.sets{display:flex;gap:7px;padding:0 11px 11px}
.set{flex:1;border:1.5px solid var(--rule);border-radius:7px;background:#fdfdfb;padding:7px 2px 6px;
  text-align:center;cursor:pointer;font:inherit;min-height:52px}
.set b{display:block;font-size:9.5px;font-weight:700;color:var(--dim);letter-spacing:.06em}
.set i{display:block;font-style:normal;font-size:17px;font-weight:800;color:#c9c5b8;margin-top:1px}
.set.filled{border-color:var(--pen);background:#f4f7ff}
.set.filled i{color:var(--pen)}
.set .prev{display:block;font-size:9px;color:#a8a496;font-weight:600;height:11px}
.cardio{margin:14px 2px 0;border:1.5px solid var(--yellow);border-radius:9px;background:#fffceb;
  padding:11px 12px;font-size:13px}
.cardio b{display:block;font-size:10.5px;letter-spacing:.08em;margin-bottom:3px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 2px 0}
.tools button{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:11px;font:inherit;
  font-size:12.5px;font-weight:700;color:var(--dim);cursor:pointer}
.tools button.full{grid-column:span 2}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(20,20,15,.55);display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .16s}
.sheet.open{opacity:1;pointer-events:auto}
.pad{width:100%;background:var(--paper);border-radius:16px 16px 0 0;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(14px);transition:transform .16s}
.sheet.open .pad{transform:none}
.padtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.padtop strong{font-size:14px}
.padtop span{font-size:12px;color:var(--dim);font-weight:700}
.readout{font-size:40px;font-weight:800;color:var(--pen);text-align:center;padding:6px 0 10px;letter-spacing:-.02em}
.readout small{font-size:15px;color:var(--dim);font-weight:700;margin-left:3px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{border:1px solid var(--rule);background:#fff;border-radius:10px;padding:15px 0;font:inherit;
  font-size:21px;font-weight:700;cursor:pointer}
.keys button.wide{grid-column:span 2}
.keys button.save{background:var(--ink);color:var(--yellow);border-color:var(--ink)}
.keys button.clear{color:#a33}
.rest{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;
  background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;display:none;
  align-items:center;justify-content:space-between;gap:12px}
.rest.on{display:flex}
.rest .t{font-size:26px;font-weight:800;color:var(--yellow);font-variant-numeric:tabular-nums}
.rest .lbl{font-size:11px;color:#a9a599;font-weight:700;letter-spacing:.06em}
.rest button{border:0;background:#2b2a23;color:#fff;border-radius:7px;padding:9px 13px;font:inherit;
  font-size:12px;font-weight:700;cursor:pointer}
.note{font-size:11px;color:var(--dim);text-align:center;margin:16px 4px 0;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:70;background:var(--ink);
  color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:20px;opacity:0;
  pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
dialog{border:0;border-radius:14px;padding:16px;max-width:min(92vw,380px);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(20,20,15,.55)}
dialog h3{margin:0 0 6px;font-size:15px}
dialog p{margin:0 0 10px;font-size:12.5px;color:var(--dim);line-height:1.5}
dialog textarea{width:100%;height:110px;border:1px solid var(--rule);border-radius:8px;padding:8px;
  font:inherit;font-size:11px;background:#fff;resize:vertical}
dialog .row{display:flex;gap:8px;margin-top:10px}
dialog .row button{flex:1;border:1px solid var(--rule);background:#fff;border-radius:8px;padding:11px;
  font:inherit;font-size:13px;font-weight:700;cursor:pointer}
dialog .row button.primary{background:var(--ink);color:var(--yellow);border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const KEY = 'gym2026';
let state = {}, week = 1, day = 0, cur = null, buf = '';

/* ---------- guardado en el propio celular ---------- */
function load(){
  try{ const v = localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}
  return {};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('No se pudo guardar'); }
}
function get(w,d,e,s){ return ((((state[w]||{})[d]||{})[e]||{})[s]) ?? null; }
function put(w,d,e,s,v){
  state[w]=state[w]||{}; state[w][d]=state[w][d]||{}; state[w][d][e]=state[w][d][e]||{};
  if(v===null) delete state[w][d][e][s]; else state[w][d][e][s]=v;
  save();
}

let toastId;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastId); toastId = setTimeout(()=>t.classList.remove('on'), 1900);
}

/* ---------- pantalla ---------- */
function dayDone(w,d){
  return PLAN[d].ex.every((x,i)=>{ for(let s=0;s<x.sets;s++){ if(get(w,d,i,s)===null) return false; } return true; });
}
function renderNav(){
  const nav = document.getElementById('nav'); nav.innerHTML='';
  PLAN.forEach((p,i)=>{
    const b=document.createElement('button');
    b.innerHTML=(i===5?'14 SET':p.day.split(' ')[0].slice(0,3))+'<span class="dot">'+(dayDone(week,i)?'✓':'')+'</span>';
    b.setAttribute('aria-current', i===day);
    b.onclick=()=>{ day=i; render(); window.scrollTo(0,0); };
    nav.appendChild(b);
  });
}
function render(){
  const p = PLAN[day];
  renderNav();
  document.getElementById('focus').innerHTML='<span>'+p.focus+'</span><small>'+p.ex.length+' ejercicios</small>';
  const m = document.getElementById('main'); m.innerHTML='';
  p.ex.forEach((x,ei)=>{
    let filled=0, sets='';
    for(let s=0;s<x.sets;s++){
      const v=get(week,day,ei,s), prev = week===2 ? get(1,day,ei,s) : null;
      if(v!==null) filled++;
      sets+='<button class="set'+(v!==null?' filled':'')+'" data-e="'+ei+'" data-s="'+s+'">'
          + '<b>S'+(s+1)+'</b><i>'+(v!==null?v:'–')+'</i>'
          + '<span class="prev">'+(prev!==null?'antes '+prev:'')+'</span></button>';
    }
    const el=document.createElement('section');
    el.className='ex'+(filled===x.sets?' done':'');
    el.innerHTML='<div class="top">'
      +'<div class="thumb" style="background-image:url(data:image/jpeg;base64,'+x.img+')"></div>'
      +'<div class="meta"><h2>'+(ei+1)+'. '+x.n+'</h2><p>'+x.note+'</p>'
      +'<span class="target">'+x.sr+'</span><span class="target">'+x.rest+'</span></div></div>'
      +'<div class="sets">'+sets+'</div>';
    m.appendChild(el);
  });

  const c=document.createElement('div'); c.className='cardio';
  c.innerHTML='<b>CARDIO</b>'+p.cardio; m.appendChild(c);

  const t=document.createElement('div'); t.className='tools';
  t.innerHTML='<button id="bk">Copiar respaldo</button>'
            + '<button id="rs">Pegar respaldo</button>'
            + '<button class="full" id="clearDay">Borrar este día</button>';
  m.appendChild(t);
  document.getElementById('bk').onclick=backup;
  document.getElementById('rs').onclick=restore;
  document.getElementById('clearDay').onclick=()=>{
    if(!confirm('¿Borrar los pesos de '+p.day+' de la semana '+week+'?')) return;
    if(state[week]) delete state[week][day];
    save(); render(); toast('Día borrado');
  };

  const n=document.createElement('p'); n.className='note';
  n.textContent='Toca una serie para anotar el peso. Se guarda en este celular.';
  m.appendChild(n);

  m.querySelectorAll('.set').forEach(b=>{ b.onclick=()=>openPad(+b.dataset.e,+b.dataset.s); });
}

/* ---------- respaldo ---------- */
const dlg=document.getElementById('dlg'), dlgBox=document.getElementById('dlgBox');
function backup(){
  document.getElementById('dlgTitle').textContent='Copiar respaldo';
  document.getElementById('dlgText').textContent='Copia este texto y guárdalo en tus notas o mándatelo por WhatsApp. Te sirve para recuperar tus pesos en otro celular.';
  dlgBox.value=JSON.stringify(state); dlgBox.readOnly=true;
  document.getElementById('dlgOk').textContent='Copiar';
  document.getElementById('dlgOk').onclick=async()=>{
    try{ await navigator.clipboard.writeText(dlgBox.value); toast('Respaldo copiado'); }
    catch(e){ dlgBox.select(); toast('Selecciona y copia'); }
    dlg.close();
  };
  dlg.showModal();
}
function restore(){
  document.getElementById('dlgTitle').textContent='Pegar respaldo';
  document.getElementById('dlgText').textContent='Pega aquí el respaldo que copiaste antes. Reemplaza todos los pesos guardados en este celular.';
  dlgBox.value=''; dlgBox.readOnly=false;
  document.getElementById('dlgOk').textContent='Restaurar';
  document.getElementById('dlgOk').onclick=()=>{
    try{
      const o=JSON.parse(dlgBox.value.trim());
      if(typeof o!=='object'||o===null) throw 0;
      state=o; save(); dlg.close(); render(); toast('Respaldo restaurado');
    }catch(e){ toast('Ese texto no es un respaldo válido'); }
  };
  dlg.showModal();
}
document.getElementById('dlgCancel').onclick=()=>dlg.close();

/* ---------- teclado ---------- */
const sheet=document.getElementById('sheet');
function openPad(e,s){
  cur={e,s};
  const x=PLAN[day].ex[e], v=get(week,day,e,s);
  buf = v!==null ? String(v) : '';
  document.getElementById('padName').textContent=x.n;
  document.getElementById('padSet').textContent='Serie '+(s+1)+' · '+x.sr;
  document.getElementById('readout').textContent=buf||'0';
  sheet.classList.add('open');
}
function closePad(){ sheet.classList.remove('open'); cur=null; }
sheet.onclick=ev=>{ if(ev.target===sheet) closePad(); };
document.querySelectorAll('.keys button').forEach(b=>{
  b.onclick=()=>{
    const k=b.dataset.k;
    if(k==='del') buf=buf.slice(0,-1);
    else if(k==='erase'){ put(week,day,cur.e,cur.s,null); closePad(); render(); return; }
    else if(k==='save'){
      const v=parseFloat(buf.replace(',','.'));
      if(!isNaN(v)){ put(week,day,cur.e,cur.s,v); startRest(PLAN[day].ex[cur.e].rest); }
      closePad(); render(); return;
    }
    else if(k==='.'){ if(!buf.includes('.')) buf+='.'; }
    else { if(buf.replace('.','').length<4) buf+=k; }
    document.getElementById('readout').textContent=buf||'0';
  };
});

/* ---------- descanso ---------- */
let restLeft=0, restId=null;
const restBox=document.getElementById('rest'), restT=document.getElementById('restT');
function parseRest(txt){
  if(txt.includes('min')){ const n=parseFloat(txt); return Math.round((isNaN(n)?2:n)*60); }
  const n=parseInt(txt); return isNaN(n)?60:n;
}
function paint(){ restT.textContent=Math.floor(restLeft/60)+':'+String(restLeft%60).padStart(2,'0'); }
function startRest(txt){
  restLeft=parseRest(txt); restBox.classList.add('on'); paint();
  clearInterval(restId);
  restId=setInterval(()=>{
    restLeft--; paint();
    if(restLeft<=0){
      clearInterval(restId); restT.textContent='¡Vamos!';
      if(navigator.vibrate) navigator.vibrate([180,80,180]);
      setTimeout(()=>restBox.classList.remove('on'),4000);
    }
  },1000);
}
document.getElementById('rest30').onclick=()=>{ restLeft+=30; paint(); };
document.getElementById('restX').onclick=()=>{ clearInterval(restId); restBox.classList.remove('on'); };

/* ---------- semana ---------- */
function setWeek(w){
  week=w;
  document.getElementById('w1').setAttribute('aria-pressed', w===1);
  document.getElementById('w2').setAttribute('aria-pressed', w===2);
  render();
}
document.getElementById('w1').onclick=()=>setWeek(1);
document.getElementById('w2').onclick=()=>setWeek(2);

/* ---------- arranque ---------- */
state=load();
const now=new Date(), wd=now.getDay();
if(now>=new Date(2026,8,14)){ day=5; setWeek(2); }
else { day=(wd>=1&&wd<=5)?wd-1:0; setWeek(now>=new Date(2026,8,7)?2:1); }

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
